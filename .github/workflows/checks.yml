name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source, datasets, documentation, and snapshot integrity
        run: python scripts/check_repository.py
      - name: Run original archived harness tests without models
        run: python -m unittest discover -s snapshots/initial -p test_harness.py -v
